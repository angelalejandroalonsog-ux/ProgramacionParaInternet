<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="stylesheet" href="stylesheet.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!--CDN via jsDelivr de Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    <title>Document</title>
</head>
<body>
    <!--EJEMPLO DE CONTAINER, CONTAINER-FLUID Y CONTAINER-LG. TIENE STYLESHEET.
    <div class="container">
        HOLA.
        Éste contenedor tiene un ancho máximo.
    </div>
    <div class="container-fluid">
        .Container-Fluid. Éste siempre se extiende al 100% el ancho de la ventana
    </div>
    <div class="container-lg">
        .Container-lg. Éste container se comporta como una mezcla de ambos,
        mientras que la anchura sea menor que la manejada por el container
        se expandirá al máximo como container-fluid. Una vez llega al máximo
        se comportará como un container común.
    </div> -->
    <!--EJEMPLO DE ROW, COL, TEXT-CENTER, CON STYLESHEET
    <div class="container text-center" > <--Bootstrap tiene clases que nos permite centrar el texto directamente en el container->
        <div class="row">
            <--Por defecto las columnas tendrán columnas que se distribuiran de forma equitativa si
            no le especificaste un ancho de columna antes.->
            <div class="col">
                columna 1.1
            </div>
            
            <div class="col">
                columna 1.2
            </div>
        </div>
        <div class="row">
            <div class="col">
                columna 2.1
            </div>
            <div class="col">
                columna 2.2
            </div>
            <div class="col">
                columna 2.3
            </div>
        </div>

    </div> HTML NO PERMITE ANIDAR COMENTARIOS, Por lo que modifiqué los comentarios.-->
    <div class="container text-center">
        <div class="row">
            <div class="col-sm-4 Columna"> <!--"Columna" es nuestra clase asignada de css personalizada-->
                col-sm-4
            </div>
            <div class="col-sm-8 Columna">
                col-sm-8
            </div>
        </div>
    </div>
</body>
</html>
